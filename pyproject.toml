[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ecg-waveform-lab"
version = "0.1.0"
description = "Hands-on ECG signal engineering with a small public waveform sample"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "wfdb>=4.2,<5",
    "matplotlib>=3.10,<4",
    "pandas>=2.2,<4",
    "torch>=2.6,<3",
    "jupyterlab>=4.3,<5",
    "ipykernel>=6.29,<8",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_waveform_lab"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
